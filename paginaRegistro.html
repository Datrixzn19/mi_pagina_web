<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>iNICIAR SESION</title>
</head>
<body>
    <h1>Pagina de registro</h1>
    <h2>ESTOY TRABAJANDO EN ESTO AUN :)</h2>


<form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Correo o nombre de usuario</label>
    <input placeholder="usuario@gmail.com" type="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Recuerdame</label>
  </div>
  <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
</form>


</body>
</html>
