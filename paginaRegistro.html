    <h1>Pagina de registro</h1>
    <h2>ESTOY TRABAJANDO EN ESTO AUN :)</h2>

<div class="contenedorLogin">
  <form>
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Correo o nombre de usuario</label>
      <input style="color: #09061d;" placeholder="usuario@gmail.com" type="email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="exampleInputPassword1">
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="exampleCheck1">
      <label class="recuerdame form-check-label" for="exampleCheck1">Recuerdame</label>
    </div>
    <button id="boton-registro" style="width:150px ; height: 50px; font-size: 20px;" type="submit" class="btn btn-primary">Iniciar Sesión</button>
  </form>
</div>
