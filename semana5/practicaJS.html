<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilosJS.css">

    <script src="introduccion.js" defer></script>
    <title>Practicando JS</title>

</head>
<body>
  <div class="container">
      <header>
          <h1>Galería De Imágenes</h1>
      </header>
      
      <div class="buscador">
          <form class="formBuscador">
              <label style="font-size: 25px;" for="url">Ingresa una URL de alguna imagen:</label>
              <input class="inputbuscador" type="url" id="url" name="url" required>
              <button id="buttonBuscador" class="buttonBuscador" type="submit">Agregarla</button>
          </form>
      </div>
      
      <div id="contenedorGaleria" class="contenedorGaleria"></div>
      

  
</body>
</html>
