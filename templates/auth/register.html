<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {%extends "base.html"%}<!--colocamos el nombre de la plantilla de la cual vamos a heredar--> 


    {% block titulo%} Registro {% endblock%}

    {% block saludo%}
        <h1>Pagina de registro</h1>
        <form action="" method="post"><!--es una buena practica este metodo, porque sino al enviar los datos se muestran en la url, con post no pero debemos especificar en la vista que vamos a recibir datos en ese metodo-->

            <label for="username">Nombre de usuario</label>
            <input name="username" type="text" id=username">
            <br>
            <label for="password">Contraseña</label>
            <input name="password" type="password" id="password">
            <br>
            <button value="Register" type="submit">Enviar</button>

        </form>

    {%endblock%}
</body>
</html>
